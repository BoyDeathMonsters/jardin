<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Jardin</title>
<meta name="description" content="Plan 2D, météo en direct et conseils d'arrosage et de plantation pour ton jardin.">
<meta name="theme-color" content="#08190f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jardin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Même langage que l'app Objectifs : une colonne, panneaux de verre sur une aurore lente, ici dans les verts du potager. */
:root {
  color-scheme: dark;
  --night: #08190f;
  --leaf: #1c7f52;
  --sun: #e9a23b;
  --earth: #a6562f;
  --ok: #6ee7a8;
  --warn: #f6c453;
  --ko: #ff8a78;
  --rain: #4f9fe0;
  --evap: #d9823c;
  --ink: #f4f9f3;
  --ink-2: rgba(244, 249, 243, .76);
  --ink-3: rgba(244, 249, 243, .58);
  --glass: rgba(255, 255, 255, .09);
  --glass-strong: rgba(255, 255, 255, .16);
  --edge: rgba(255, 255, 255, .22);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --spring: cubic-bezier(.3, 1.4, .5, 1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--ink); font: 400 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }

.aurora { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(60px); animation: drift 26s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 70vmax; height: 70vmax; left: -25vmax; top: -22vmax; background: var(--leaf); opacity: .85; }
.aurora i:nth-child(2) { width: 52vmax; height: 52vmax; right: -20vmax; top: 18vh; background: var(--earth); opacity: .55; animation-duration: 33s; animation-delay: -9s; }
.aurora i:nth-child(3) { width: 46vmax; height: 46vmax; left: 4vmax; bottom: -24vmax; background: var(--sun); opacity: .4; animation-duration: 39s; animation-delay: -17s; }
@keyframes drift { to { transform: translate(9vmax, 7vmax) scale(1.14); } }

.app { position: relative; z-index: 1; width: 100%; max-width: 640px; margin: 0 auto; padding-block: calc(22px + env(safe-area-inset-top, 0px)) calc(116px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
header > div { min-width: 0; }
h1 { margin: 0; font: 700 clamp(26px, 7vw, 32px)/1.08 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
#sync { margin-top: 3px; color: var(--ink-2); font-size: 13px; }
main { display: grid; gap: 14px; min-width: 0; }

.glass { position: relative; border-radius: 26px; background: linear-gradient(155deg, var(--glass-strong), var(--glass) 46%); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(26px) saturate(175%); backdrop-filter: blur(26px) saturate(175%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .34), inset 0 -1px 0 rgba(255, 255, 255, .07), 0 16px 38px rgba(2, 14, 8, .3); }
.panel { padding: 18px; min-width: 0; }
.panel > h2 { margin: 0 0 12px; }
h2 { font: 700 18px/1.2 var(--font-display); letter-spacing: -.01em; }
h3 { margin: 0; font: 600 15px/1.3 var(--font-body); }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
a { color: var(--ink); }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.icon-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; padding: 0; font-size: 19px; transition: transform .25s var(--spring); }
.icon-btn:active { transform: scale(.9); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.primary, .soft { min-height: 44px; padding: 0 16px; border-radius: 99px; font-weight: 600; transition: transform .25s var(--spring); }
.primary { border: 0; background: var(--ok); color: #05281a; }
.soft { border: 1px solid var(--edge); background: rgba(255, 255, 255, .1); }
.primary:active, .soft:active { transform: scale(.96); }
.primary:disabled, .soft:disabled { opacity: .5; cursor: default; }
.wide { width: 100%; }
.danger { color: var(--ko); }
.ghost { padding: 0; border: 0; background: none; color: var(--ink-2); text-decoration: underline; font-size: 13px; }

.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .field > label, legend { font-weight: 600; font-size: 14px; }
.hint { color: var(--ink-3); font-size: 12.5px; }
input, select, textarea { display: block; width: 100%; min-width: 0; min-height: 44px; padding: 10px 13px; border-radius: 16px; border: 1px solid var(--edge); background: rgba(3, 20, 12, .32); color: var(--ink); font: 400 16px/1.4 var(--font-body); }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; padding: 0; flex: none; accent-color: var(--ok); }
select option { background: #10291c; color: var(--ink); }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
textarea { min-height: 72px; resize: vertical; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 38px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--edge); background: rgba(255, 255, 255, .07); color: var(--ink-2); font-size: 13.5px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #0b2316; }
.tag { display: inline-block; padding: 2px 9px; border-radius: 99px; background: rgba(255, 255, 255, .12); color: var(--ink-2); font-size: 12px; }
.tag.oui { background: var(--ok); color: #05281a; font-weight: 600; }
.tag.prudence { background: var(--warn); color: #2e1f00; font-weight: 600; }
.tag.non { background: rgba(255, 255, 255, .14); color: var(--ink-2); }

.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .16); }
.steps i.on { background: var(--ok); }
.results { display: grid; gap: 6px; }
.result { display: block; width: 100%; padding: 11px 13px; text-align: left; border-radius: 14px; border: 1px solid var(--edge); background: rgba(255, 255, 255, .07); }
.form-error { color: var(--ko); font-weight: 500; }

.weather-now { display: flex; align-items: center; gap: 14px; }
.weather-icon { font-size: 52px; line-height: 1; }
.temp { font: 700 56px/.95 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.tile { min-width: 0; padding: 10px 11px; border-radius: 16px; background: rgba(255, 255, 255, .08); }
.tile b { display: block; font: 700 19px/1.15 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile span { display: block; color: var(--ink-2); font-size: 12px; line-height: 1.25; margin-top: 2px; }
.days { display: flex; gap: 6px; overflow-x: auto; margin: 14px -18px -6px; padding: 0 18px 6px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; width: 58px; padding: 8px 2px; border-radius: 16px; text-align: center; background: rgba(255, 255, 255, .07); font-size: 12px; }
.day b { display: block; font-size: 13px; }
.day .ico { font-size: 21px; display: block; margin: 2px 0; }
.day .rain { color: var(--rain); }

.advice { display: grid; gap: 2px; list-style: none; margin: 0; padding: 0; }
.advice li { display: flex; gap: 11px; padding: 11px 0; min-width: 0; }
.advice li + li { box-shadow: 0 -1px 0 rgba(255, 255, 255, .1); }
.advice .ico { flex: none; width: 26px; font-size: 21px; text-align: center; line-height: 1.2; }
.advice .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.advice button.link { padding: 0; border: 0; background: none; text-align: left; font-weight: 600; }
.urgent { color: var(--ko); }
.chart { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
#chartTip { min-height: 20px; font-size: 13px; color: var(--ink-2); }

.plan-wrap { position: relative; border-radius: 20px; overflow: hidden; background: rgba(3, 20, 12, .35); }
#plan { display: block; width: 100%; height: min(58vh, 520px); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.plan-tools { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; }
.plan-tools button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--edge); background: rgba(8, 25, 15, .72); font-size: 18px; padding: 0; }
.north { position: absolute; left: 10px; top: 10px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: rgba(8, 25, 15, .72); font-size: 11px; font-weight: 700; }
.north span { display: block; line-height: 1; text-align: center; }
.scale { position: absolute; left: 10px; bottom: 10px; padding: 3px 8px; border-radius: 9px; background: rgba(8, 25, 15, .72); font-size: 12px; }

.culture { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 0; border: 0; background: none; text-align: left; }
.culture + .culture { box-shadow: 0 -1px 0 rgba(255, 255, 255, .1); }
.culture .emo { flex: none; font-size: 28px; width: 36px; text-align: center; }
.gauge { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .14); overflow: hidden; margin-top: 6px; }
.gauge i { display: block; height: 100%; border-radius: 4px; background: var(--rain); }
.gauge i.low { background: var(--warn); }
.gauge i.dry { background: var(--ko); }
.plants { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.plant-tile { min-width: 0; padding: 10px 6px; display: grid; justify-items: center; gap: 3px; border-radius: 18px; border: 1px solid var(--edge); background: rgba(255, 255, 255, .07); text-align: center; }
.plant-tile .emo { font-size: 26px; line-height: 1.15; }
.plant-tile .nm { font-size: 13px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }

.verdict { padding: 14px; border-radius: 18px; background: rgba(255, 255, 255, .1); }
.verdict.oui { background: rgba(110, 231, 168, .22); }
.verdict.prudence { background: rgba(246, 196, 83, .22); }
.verdict.non { background: rgba(255, 138, 120, .18); }
.verdict h3 { font: 700 21px/1.15 var(--font-display); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.checks li { display: flex; gap: 10px; min-width: 0; }
.mark { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
.mark.ok { background: var(--ok); color: #05281a; }
.mark.warn { background: var(--warn); color: #2e1f00; }
.mark.block { background: var(--ko); color: #3a0d05; }
.mark.info { background: rgba(255, 255, 255, .2); }
.cal { display: grid; grid-template-columns: 62px repeat(12, 1fr); gap: 3px; align-items: center; font-size: 11px; }
.cal .m { text-align: center; color: var(--ink-3); }
.cal .c { height: 16px; border-radius: 4px; background: rgba(255, 255, 255, .08); }
.cal .c.on { background: var(--ok); }
.cal .c.now { outline: 1.5px solid var(--ink); outline-offset: 1px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 4px; text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; }
tr + tr td { box-shadow: 0 -1px 0 rgba(255, 255, 255, .08); }

dialog { width: min(calc(100% - 20px), 620px); max-height: calc(100dvh - 20px - env(safe-area-inset-top, 0px)); margin: auto auto 10px; padding: 0; color: var(--ink); border-radius: 26px; border: 1px solid var(--edge); background: rgba(14, 38, 25, .94); -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 -10px 50px rgba(0, 0, 0, .5); overflow-y: auto; overscroll-behavior: contain; }
dialog::backdrop { background: rgba(2, 10, 5, .55); }
.sheet { padding: 18px; display: grid; gap: 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h2 { margin: 0; font-size: 21px; min-width: 0; }
.close { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--edge); background: rgba(255, 255, 255, .1); padding: 0; font-size: 18px; }

nav.glass { position: fixed; z-index: 5; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 24px), 480px); transform: translateX(-50%); padding: 5px; border-radius: 99px; display: grid; grid-template-columns: repeat(5, 1fr); }
nav::before { content: ""; position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 5); border-radius: 99px; background: rgba(255, 255, 255, .22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .45s var(--spring); }
nav button { position: relative; min-height: 46px; padding: 0 1px; border: 0; border-radius: 99px; background: none; color: var(--ink-2); font-size: 13px; font-weight: 600; }
nav button[aria-current="page"] { color: var(--ink); }

#toast { position: fixed; z-index: 20; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); width: min(calc(100% - 32px), 440px); transform: translateX(-50%); padding: 12px 16px; border-radius: 18px; background: rgba(12, 44, 28, .92); }
#toast.bad { background: rgba(70, 18, 10, .92); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
  <header>
    <div>
      <h1 id="title">Mon jardin</h1>
      <div id="sync" role="status"></div>
    </div>
    <button id="refresh" class="icon-btn glass" type="button" aria-label="Actualiser la météo" title="Actualiser la météo" data-act="refresh">↻</button>
  </header>
  <main id="main"></main>
</div>
<nav id="tabs" class="glass" aria-label="Sections">
  <button type="button" data-tab="jour">Jour</button>
  <button type="button" data-tab="plan">Plan</button>
  <button type="button" data-tab="cultures">Cultures</button>
  <button type="button" data-tab="planter">Planter</button>
  <button type="button" data-tab="jardin">Jardin</button>
</nav>
<dialog id="sheet"></dialog>
<div id="toast" class="glass" role="alert" hidden></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="plants.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
